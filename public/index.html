<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitZapl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0d1117',
                        cardBg: '#161b22',
                        borderCol: '#30363d',
                        accentBlue: '#58a6ff'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 font-sans min-p-0 m-0 selection:bg-accentBlue selection:text-black">

    <!-- Шапка -->
    <header class="border-b border-borderCol bg-cardBg/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-accentBlue/10 p-2 rounded-lg border border-accentBlue/30 text-accentBlue">
                <i class="fa-solid fa-cloud text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide text-white">ZAPL-corp <span class="text-xs px-2 py-0.5 rounded bg-accentBlue/20 text-accentBlue border border-accentBlue/30 ml-2">Cloud Git</span></h1>
                <p class="text-xs text-gray-400">Прямой доступ к проектам GitHub организации</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <a href="https://github.com/ZAPL-corp" target="_blank" class="bg-gray-800 hover:bg-gray-700 border border-borderCol px-3 py-1.5 rounded-md text-sm font-medium transition flex items-center space-x-2">
                <i class="fa-brands fa-github"></i>
                <span>Открыть GitHub</span>
            </a>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- Панель поиска и фильтров -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-center">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-search absolute left-3.5 top-3 text-gray-400"></i>
                <input type="text" id="searchInput" oninput="filterRepos()" placeholder="Поиск проектов..." 
                    class="w-full bg-cardBg border border-borderCol rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-accentBlue text-white transition">
            </div>
            <div class="text-sm text-gray-400" id="repoCount">Загрузка репозиториев...</div>
        </div>

        <!-- Сетка репозиториев -->
        <div id="reposGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Динамически заполняется -->
        </div>
    </main>

    <!-- Модальное окно просмотра файлов / git clone -->
    <div id="repoModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-cardBg border border-borderCol rounded-xl w-full max-w-4xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-150">
            <div class="px-6 py-4 border-b border-borderCol flex items-center justify-between bg-darkBg/50">
                <h3 id="modalTitle" class="font-bold text-lg text-white flex items-center space-x-2"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-borderCol/50 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-6 flex-1">
                <!-- Блок Git Clone -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Клонировать репозиторий через Git:</label>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="cloneUrlInput" readonly class="w-full bg-darkBg border border-borderCol rounded-lg px-3 py-2 text-sm text-accentBlue font-mono select-all">
                        <button onclick="copyCloneUrl()" class="bg-accentBlue hover:bg-accentBlue/80 text-black font-semibold px-4 py-2 rounded-lg text-sm transition shrink-0 flex items-center space-x-1.5">
                            <i class="fa-regular fa-copy"></i>
                            <span>Копировать</span>
                        </button>
                    </div>
                </div>

                <!-- Блок файлов проекта -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Файлы проекта:</span>
                        <a id="downloadZipBtn" href="#" target="_blank" class="text-xs text-accentBlue hover:underline flex items-center space-x-1">
                            <i class="fa-solid fa-download"></i>
                            <span>Скачать ZIP архивом</span>
                        </a>
                    </div>
                    <div id="fileListContainer" class="bg-darkBg border border-borderCol rounded-lg divide-y divide-borderCol text-sm">
                        <!-- Список файлов -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allRepos = [];

        async function fetchRepos() {
            try {
                const res = await fetch('/api/repos');
                allRepos = await res.json();
                renderRepos(allRepos);
            } catch (err) {
                document.getElementById('reposGrid').innerHTML = `<div class="col-span-3 text-center text-red-400 py-10">Ошибка загрузки репозиториев: ${err.message}</div>`;
            }
        }

        function renderRepos(repos) {
            const grid = document.getElementById('reposGrid');
            document.getElementById('repoCount').innerText = `Всего проектов: ${repos.length}`;

            if (repos.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center text-gray-500 py-10">Проекты не найдены</div>`;
                return;
            }

            grid.innerHTML = repos.map(r => `
                <div class="bg-cardBg border border-borderCol rounded-xl p-5 flex flex-col justify-between hover:border-gray-500 transition group shadow-sm">
                    <div>
                        <div class="flex items-start justify-between mb-2">
                            <a href="${r.html_url}" target="_blank" class="font-bold text-accentBlue text-base hover:underline flex items-center space-x-2">
                                <i class="fa-solid fa-book-bookmark text-xs text-gray-400"></i>
                                <span>${r.name}</span>
                            </a>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-borderCol text-gray-300 border border-gray-700">${r.language}</span>
                        </div>
                        <p class="text-gray-400 text-sm mb-4 line-clamp-2">${r.description}</p>
                    </div>
                    
                    <div class="pt-4 border-t border-borderCol flex items-center justify-between mt-auto">
                        <span class="text-xs text-gray-500">Изменен: ${new Date(r.updated_at).toLocaleDateString()}</span>
                        <button onclick="openRepoDetails('${r.name}', '${r.clone_url}', '${r.default_branch}')" 
                            class="bg-borderCol hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-code-branch"></i>
                            <span>Файлы / Git</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterRepos() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allRepos.filter(r => r.name.toLowerCase().includes(query) || r.description.toLowerCase().includes(query));
            renderRepos(filtered);
        }

        async function openRepoDetails(repoName, cloneUrl, defaultBranch) {
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-cube text-accentBlue"></i> <span>${repoName}</span>`;
            document.getElementById('cloneUrlInput').value = cloneUrl;
            document.getElementById('downloadZipBtn').href = `https://github.com/ZAPL-corp/${repoName}/archive/refs/heads/${defaultBranch}.zip`;
            
            const fileContainer = document.getElementById('fileListContainer');
            fileContainer.innerHTML = `<div class="p-4 text-center text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Загрузка файлов...</div>`;
            
            document.getElementById('repoModal').classList.remove('hidden');

            try {
                const res = await fetch(`/api/repos/${repoName}/contents`);
                const files = await res.json();

                if (!Array.isArray(files)) {
                    fileContainer.innerHTML = `<div class="p-4 text-center text-gray-500">Пустой репозиторий или ошибка доступа</div>`;
                    return;
                }

                fileContainer.innerHTML = files.map(f => `
                    <div class="px-4 py-2.5 flex items-center justify-between hover:bg-darkBg/60 transition">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid ${f.type === 'dir' ? 'fa-folder text-yellow-500' : 'fa-file-lines text-gray-400'} w-4 text-center"></i>
                            <span class="${f.type === 'dir' ? 'font-medium text-white' : 'text-gray-300'}">${f.name}</span>
                        </div>
                        <a href="${f.html_url}" target="_blank" class="text-xs text-gray-500 hover:text-accentBlue transition">Открыть <i class="fa-solid fa-arrow-up-right-from-square ml-0.5"></i></a>
                    </div>
                `).join('');
            } catch (err) {
                fileContainer.innerHTML = `<div class="p-4 text-center text-red-400">Не удалось загрузить файловую структуру</div>`;
            }
        }

        function closeModal() {
            document.getElementById('repoModal').classList.add('hidden');
        }

        function copyCloneUrl() {
            const input = document.getElementById('cloneUrlInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('URL для git clone скопирован в буфер обмена!');
        }

        // Закрытие по клику вне модалки
        window.onclick = function(event) {
            const modal = document.getElementById('repoModal');
            if (event.target === modal) closeModal();
        }

        fetchRepos();
    </script>
</body>
</html>
